# Production compose — runs on the VPS. Only `api` and `db` are
# containerized; NGINX + Certbot run on the host (not in Docker) and serve
# apps/platform and apps/admin's static builds directly from disk. See
# PRD.md (bagian 16, "Deployment") and deploy/nginx.conf for the other half
# of this setup.
services:
  db:
    image: postgres:16-alpine # Pakai image dari registry (tidak build)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data # Persistent storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No `ports:` — only `api` needs to reach it, over the internal compose
    # network as host "db". Not published to the VPS's network interface.

  api:
    # `image:` so the VPS can `docker compose pull` a pre-built image (CI
    # builds and pushes it — see .github/workflows/deployment.yaml) instead
    # of building on a resource-limited VM. `build:` is kept for local use
    # (`docker compose build` / `docker compose up --build`), and
    # `${API_IMAGE:-...}` lets the VPS's own .env pin a specific tag
    # (e.g. a commit SHA, for rollback) without editing this file.
    image: ${API_IMAGE:-ghcr.io/wahyukurnwn/solo-outreach-pipeline/api:latest}
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      # Bound to localhost only: the public interface is NGINX (host,
      # TLS via Certbot), which reverse-proxies /api/* to 127.0.0.1:8000.
      # The container is never reachable directly from the internet.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Overrides whatever DATABASE_URL is in .env — inside this compose
      # network Postgres is only reachable at the service name "db", never
      # at the localhost address a developer's .env normally has.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # HEALTHCHECK is defined in apps/api/Dockerfile (GET /health).

volumes:
  pgdata: # Declare named volume
