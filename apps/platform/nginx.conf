server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Prerendered pages are real files/directories (see PRD.md, bagian 16 —
	# `prerender.enabled` + `spa.enabled`). Anything that doesn't match one
	# — dynamic routes like /prospect/:id — falls back to the SPA shell,
	# which boots the client router and renders it there.
	location / {
		try_files $uri $uri/ /_shell.html;
	}

	# Hashed build assets are immutable; cache them aggressively.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# HTML must never be cached this aggressively — it references the
	# current asset hashes.
	location ~ \.html$ {
		add_header Cache-Control "no-cache";
	}
}
