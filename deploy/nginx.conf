# Reference NGINX config for the VPS host — NOT run in Docker.
# See PRD.md (bagian 16, "Decision change — deployment architecture") for
# why: only `api` and `db` are containerized; NGINX + Certbot run directly
# on the host and serve apps/platform and apps/admin's static builds from
# disk. Copy the relevant server blocks into /etc/nginx/sites-available/,
# symlink into sites-enabled, then run `certbot --nginx` per domain to fill
# in the TLS directives (it edits these files in place).
#
# Replace every <...> placeholder before using this. Three separate
# domains are used — not one domain proxying everything — because the app's
# session cookie (refresh_token) and CORS are already built around platform,
# admin and api being distinct origins (see PRD.md bagian 15 "Sesi" and
# bagian 16 "Domain dan cookie"); collapsing them behind one origin would
# be a different, untested auth architecture, not just an nginx change.

# ---- platform: app.<domain> — static files only ----
server {
	listen 80;
	server_name app.<domain>;
	root /var/www/platform/current; # rsync target for apps/platform/dist/client

	location / {
		try_files $uri $uri/ /_shell.html;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location ~ \.html$ {
		add_header Cache-Control "no-cache";
	}
}

# ---- admin: admin.<domain> — static files only ----
server {
	listen 80;
	server_name admin.<domain>;
	root /var/www/admin/current; # rsync target for apps/admin/dist/client

	location / {
		try_files $uri $uri/ /_shell.html;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location ~ \.html$ {
		add_header Cache-Control "no-cache";
	}
}

# ---- api: api.<domain> — reverse proxy to the Docker container ----
server {
	listen 80;
	server_name api.<domain>;

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# The rate limiter (apps/api/src/libs/rate-limit.ts) keys off the
		# caller's IP — without this it would see every request as
		# coming from nginx itself (127.0.0.1).
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
