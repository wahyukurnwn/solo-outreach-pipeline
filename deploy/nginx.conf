# NGINX config for the VPS host — NOT run in Docker. This is the actual
# live config for wahyukurnwn.com (kept in sync manually after edits on the
# VPS — see PRD.md bagian 16, "Decision change — deployment architecture"
# for why NGINX + Certbot run on the host rather than in a container).
#
# All three domains sit behind Cloudflare in "Proxied" mode (orange cloud),
# not DNS-only — see the `set_real_ip_from` block below for why that
# requires nginx config changes, not just a Cloudflare dashboard toggle.
#
# Three separate domains are used — not one domain proxying everything —
# because the app's session cookie (refresh_token) and CORS are already
# built around platform, admin and api being distinct origins (see PRD.md
# bagian 15 "Sesi" and bagian 16 "Domain dan cookie"); collapsing them
# behind one origin would be a different, untested auth architecture, not
# just an nginx change.

# ---- platform: app.wahyukurnwn.com — static files only ----
server {
	server_name app.wahyukurnwn.com;
	root /var/www/platform/current; # rsync target for apps/platform/dist/client

	location / {
		try_files $uri $uri/ /_shell.html;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location ~ \.html$ {
		add_header Cache-Control "no-cache";
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/app.wahyukurnwn.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/app.wahyukurnwn.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---- admin: admin.wahyukurnwn.com — static files only ----
server {
	server_name admin.wahyukurnwn.com;
	root /var/www/admin/current; # rsync target for apps/admin/dist/client

	location / {
		try_files $uri $uri/ /_shell.html;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location ~ \.html$ {
		add_header Cache-Control "no-cache";
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/admin.wahyukurnwn.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/admin.wahyukurnwn.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---- api: api.wahyukurnwn.com — reverse proxy to the Docker container ----
server {
	server_name api.wahyukurnwn.com;

	# With Cloudflare set to "Proxied", every request nginx sees arrives
	# from one of Cloudflare's own edge IPs, not the visitor's real one —
	# $remote_addr would just be Cloudflare over and over, which breaks
	# the per-IP rate limiter (apps/api/src/libs/rate-limit.ts) entirely
	# (every visitor shares one bucket). ngx_http_realip_module fixes this
	# at the trust boundary: only when the *connecting* IP is verified to
	# be one of Cloudflare's published ranges below does nginx replace
	# $remote_addr with the value of CF-Connecting-IP — a header only
	# Cloudflare's edge sets, so a client can't spoof it by sending its
	# own. That's why this reads CF-Connecting-IP instead of trusting
	# X-Forwarded-For directly: XFF can already contain a client-supplied
	# prefix by the time it reaches Cloudflare, CF-Connecting-IP can't.
	#
	# Ranges from https://www.cloudflare.com/ips-v4 / ips-v6 — Cloudflare
	# updates these occasionally; re-check periodically.
	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# $remote_addr is now the real visitor IP (see real_ip block
		# above) whenever the request genuinely came through Cloudflare —
		# set it directly rather than appending via
		# $proxy_add_x_forwarded_for, so the header nginx forwards can't
		# carry a spoofed prefix through from earlier in the chain.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/api.wahyukurnwn.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/api.wahyukurnwn.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = app.wahyukurnwn.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name app.wahyukurnwn.com;
	return 404; # managed by Certbot
}

server {
	if ($host = admin.wahyukurnwn.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name admin.wahyukurnwn.com;
	return 404; # managed by Certbot
}

server {
	if ($host = api.wahyukurnwn.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name api.wahyukurnwn.com;
	return 404; # managed by Certbot
}
